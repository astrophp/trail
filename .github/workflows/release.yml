name: release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify tag and commit
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          scripts/release/tag-version.sh "$TAG"
          git fetch origin main
          scripts/release/on-main.sh "$SHA"

      - name: Require successful checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for workflow in tests.yml install.yml; do
            scripts/release/wait-for-runs.sh "$workflow" "$SHA"
          done

      - name: Verify committed build
        run: |
          npm ci
          npm run build
          git diff --exit-code -- dist resources/js/lib/cn-tables.ts

      - name: Read release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          notes=$(scripts/release/changelog-entry.sh "$TAG")
          printf 'notes=%s\n' "$(printf '%s' "$notes" | base64 --wrap=0)" >> "$GITHUB_OUTPUT"

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ needs.verify.outputs.notes }}
        run: |
          lookup=$(mktemp)
          if gh api "repos/$GH_REPO/releases/tags/$TAG" > "$lookup" 2>&1; then
            printf 'A GitHub release already exists for %s; refusing to change it.\n' "$TAG" >&2
            exit 1
          fi
          # gh api exits non-zero for HTTP errors; only a 404 permits creation.
          if ! grep -q 'HTTP 404' "$lookup"; then
            cat "$lookup" >&2
            printf 'Could not check whether a GitHub release exists for %s.\n' "$TAG" >&2
            exit 1
          fi
          printf '%s' "$NOTES" | base64 --decode > release-notes.md
          args=(release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md)
          case "$TAG" in *-*) args+=(--prerelease);; esac
          gh "${args[@]}"

  packagist:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/release

      - name: Wait for Packagist
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release/packagist-wait.sh "$TAG"
