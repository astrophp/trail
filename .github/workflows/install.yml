name: install

# Installs the archive of the commit (what a tag ships) into a fresh Laravel application and checks
# that it records. On main it runs for every push, with no path filter, so a release can require it
# green for the tagged commit.
#
# A pull request runs it unless every changed file is one that cannot reach the shipped archive:
# the frontend sources, docs, workbench, tests (except tests/Install, which the test uses) and the
# Markdown files that are export-ignored. The filter is inverted on purpose: a new top-level file
# matches no list of shipped paths, and the archive allowlist check has to see it before the
# merge, not after. The Markdown files are named one by one, not with a glob, so a new one still
# runs the check; README.md ships and is not excluded. GitHub evaluates the patterns in order and a
# later one overrides an earlier one, so tests/Install/** comes after the !tests/** it cuts out of.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**'
      - '!resources/js/**'
      - '!docs/**'
      - '!workbench/**'
      - '!tests/**'
      - 'tests/Install/**'
      - '!ROADMAP.md'
      - '!SECURITY.md'
      - '!CLAUDE.md'
      - '!CONTRIBUTING.md'
      - '!CHANGELOG.md'

permissions:
  contents: read

concurrency:
  group: install-${{ github.ref }}
  # Never cancel a run on main: a release requires it green for the tagged commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install:
    name: Laravel ${{ matrix.laravel }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The lowest legs run on PHP 8.3, the oldest the package allows, so the lowest
        # resolution runs on the oldest runtime. The stable legs run on 8.4: tests.yml
        # already covers 8.3 to 8.5 for the package's own suite, and a fresh install today
        # lands on a current PHP.
        include:
          - { laravel: '12', dependencies: stable, php: '8.4', flags: '' }
          - { laravel: '12', dependencies: lowest, php: '8.3', flags: '--lowest' }
          - { laravel: '13', dependencies: stable, php: '8.4', flags: '' }
          - { laravel: '13', dependencies: lowest, php: '8.3', flags: '--lowest' }
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      - name: Install test
        run: scripts/install-test.sh ${{ matrix.laravel }} ${{ matrix.flags }}
